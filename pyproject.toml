[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synths"
version = "0.1.0"
description = "Make sounds and music in Python: synths, samples, effects and tracker songs, for games and for fun. The sound sibling of Pyctures."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Wylie" }]
keywords = ["sound", "music", "synth", "synthesizer", "tracker", "mod", "samples", "games", "audio", "education", "pyodide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/johnwylie70/synths-py"
Issues = "https://github.com/johnwylie70/synths-py/issues"
Changelog = "https://github.com/johnwylie70/synths-py/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
